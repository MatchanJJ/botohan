[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Set in your shell, never in a committed file. Only needed for deploy/verify, not build/test.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[lint]
# Polls are scheduled by timestamp on purpose (seconds of validator drift don't matter here),
# and createPoll must reject a bad option inside the copy loop.
exclude_lints = ["block-timestamp", "require-revert-in-loop"]
